services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    # 이전 값들(KAFKA_CFG_*, /bitnami/kafka)은 bitnami/kafka 이미지 전용 규약이라
    # 공식 apache/kafka 이미지에서는 인식되지 않아 zookeeper.connect 누락으로 계속 크래시했음
    # (docker logs로 확인). 공식 이미지 규약(KAFKA_<PROPERTY>, '_'→'.')으로 교체.
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1

  # Judge0(자체 호스팅) — docs/CLAUDE.md: 사용자 코드는 반드시 이 샌드박스를 통해서만 실행.
  judge0-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0pass
      - POSTGRES_DB=judge0
    volumes:
      - judge0_db_data:/var/lib/postgresql/data

  judge0-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "judge0pass"]
    volumes:
      - judge0_redis_data:/data

  judge0-server:
    image: judge0/judge0:1.13.1
    restart: unless-stopped
    privileged: true
    ports:
      - "2358:2358"
    environment:
      - REDIS_HOST=judge0-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=judge0pass
      - POSTGRES_HOST=judge0-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0pass
      # backend/app/judge/engine.py의 DEFAULT_MEMORY_LIMIT_KB(1024*1024=1GB)를 그대로 받아주려면
      # Judge0 기본 상한(500,000KB)보다 커야 함. 안 맞으면 모든 제출이 422로 즉시 거부됨(실측 확인).
      - MAX_MEMORY_LIMIT=1048576
    depends_on: [judge0-db, judge0-redis]

  judge0-workers:
    image: judge0/judge0:1.13.1
    restart: unless-stopped
    command: ["./scripts/workers"]
    privileged: true
    environment:
      - REDIS_HOST=judge0-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=judge0pass
      - POSTGRES_HOST=judge0-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0pass
      - MAX_MEMORY_LIMIT=1048576
      - MEMORY_LIMIT_CHANGE_BY_USER=true
    depends_on: [judge0-db, judge0-redis]

  backend:
    build: .
    depends_on: [kafka, judge0-server]
    restart: unless-stopped
    expose: ["8000"]
    environment:
      - JUDGE0_URL=http://judge0-server:2358
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092

  #frontend:
  #  build: ./frontend
  #  restart: unless-stopped
  #  expose: ["3000"]
  nginx:
    image: nginx:alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx:/etc/nginx/conf.d
    # frontend 서비스가 위에서 주석 처리돼 있어 depends_on에 넣으면 정의되지 않은 서비스를
    # 참조하게 되어 compose 파일 전체가 파싱조차 안 됨(docker compose config 실패 확인함).
    # frontend를 다시 도커화하면 여기 같이 추가할 것.
    depends_on: [backend]



volumes:
  redis_data:
  kafka_data:
  judge0_db_data:
  judge0_redis_data:
